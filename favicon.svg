<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#glow-gradient)" filter="url(#glow)"/>
  
  <!-- G Letter Stylized -->
  <text x="32" y="42" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">G</text>
  
  <!-- Sparkle -->
  <circle cx="48" cy="18" r="4" fill="white" opacity="0.9"/>
  <circle cx="16" cy="46" r="3" fill="white" opacity="0.7"/>
</svg>

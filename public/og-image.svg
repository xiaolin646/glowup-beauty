<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="50%" style="stop-color:#fdf2f8"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="950" cy="150" r="200" fill="#fbcfe8" opacity="0.5"/>
  <circle cx="200" cy="500" r="180" fill="#fbcfe8" opacity="0.4"/>
  <circle cx="600" cy="315" r="250" fill="#f9a8d4" opacity="0.2"/>
  
  <!-- Logo circle -->
  <circle cx="600" cy="240" r="80" fill="url(#accentGrad)"/>
  <path d="M600 200 L620 230 L600 260 L580 230 Z" fill="white"/>
  <circle cx="600" cy="230" r="5" fill="white"/>
  
  <!-- Brand name -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="#831843">GlowUp</text>
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#be185d">美妆社区</text>
  
  <!-- Tagline -->
  <text x="600" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#9f1239">遇见更美的自己</text>
  
  <!-- Decorative elements -->
  <g fill="#ec4899" opacity="0.6">
    <circle cx="300" cy="200" r="8"/>
    <circle cx="900" cy="400" r="8"/>
    <circle cx="850" cy="180" r="6"/>
    <circle cx="350" cy="450" r="6"/>
  </g>
</svg>
